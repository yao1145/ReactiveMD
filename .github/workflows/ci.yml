name: CI

# Action refs use explicit major versions. GitHub ships security updates within
# a major tag; review these refs when an action changes its Node runtime or is
# deprecated.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check third-party notices
        run: npm run notices && git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - run: npm run test:packed
      - run: npm run test:docs

      # build:demo and test:demo each rebuild the library. Call the demo halves
      # directly so the library from `npm run build` is built once.
      - name: Build demo
        run: npm run build --workspace=@reactive-md/demo
      - name: Test demo
        run: npm run test --workspace=@reactive-md/demo
      - name: Record core benchmark
        if: matrix.node == '24'
        run: npm run benchmark
      - name: Upload core benchmark
        if: matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: core-benchmark-node-24
          path: artifacts/benchmark.json
          retention-days: 7

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:demo
      - name: Install Playwright Chromium
        run: npm exec --workspace=@reactive-md/demo -- playwright install --with-deps chromium
      - name: Run browser checks against the built demo
        env:
          DEMO_URL: http://127.0.0.1:4173
          PLAYWRIGHT_CHANNEL: chromium
        run: |
          set -euo pipefail
          npm run preview --workspace=@reactive-md/demo -- --port 4173 --strictPort > preview.log 2>&1 &
          preview_pid=$!
          cleanup() { kill "$preview_pid" 2>/dev/null || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent "$DEMO_URL" > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent "$DEMO_URL" > /dev/null

          npm run test:browser
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-artifacts-node-24
          path: |
            demo/artifacts/
            preview.log
          if-no-files-found: ignore
          retention-days: 7
