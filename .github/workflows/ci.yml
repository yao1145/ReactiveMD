name: CI

# Action refs use explicit major versions. GitHub ships security updates within
# a major tag; review these refs when an action changes its Node runtime or is
# deprecated.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.12', '24']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Check third-party notices
        run: npm run notices && git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Run the Node release gate
        run: npm run verify:release:node
      - name: Record core benchmark
        if: matrix.node == '24'
        run: npm run benchmark
      - name: Upload core benchmark
        if: matrix.node == '24'
        uses: actions/upload-artifact@v7
        with:
          name: core-benchmark-node-24
          path: artifacts/benchmark.json
          retention-days: 7
      - name: Upload Node release verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-node-${{ matrix.node }}
          path: |
            artifacts/release-verification.json
            artifacts/release-verification/
            artifacts/release-package/
          if-no-files-found: ignore
          retention-days: 7

  browser:
    name: Browser (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npm exec --workspace=@reactive-md/demo -- playwright install --with-deps chromium
      - name: Run the browser release gate
        env:
          PLAYWRIGHT_CHANNEL: chromium
          SHAREABLE_RESULTS: artifacts/shareable-results.json
        run: npm run verify:release:browser
      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-verification-browser-node-24
          path: |
            demo/artifacts/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7
